[FilterPlugin]
; Extra files `RunUAT BuildPlugin -Package=<dir>` copies into the redistributable plugin, on top of
; its default set (the .uplugin, Source/, Resources/, Content/, Shaders/ and build products).
; Paths are relative to the plugin root; a leading "/" anchors to it, "..." matches any depth, a
; leading "-" excludes, and the latest matching rule wins. This file affects only BuildPlugin
; packages, never cooking or staging a game.

; Licence and the documents every other page links to.
/LICENSE
/README.md
/AGENTS.md
/CHANGELOG.md
/docs/...

; Developing the plugin itself (roadmap, test strategy, benchmarks) is for its repository, not a package.
-/docs/dev/...

; Valid starting points, the demo scenes' behavior files, and the fixtures the validator and the
; tests read at run time (diagnostics, conformance, golden traces, world-test behaviors, scenarios).
/Examples/...
/Demo/...
/Fixtures/...

; Headless validation, test and portability scripts. They resolve the host project themselves.
/Tools/...

; This file, so a reader of the package can see why the folders above are there.
/Config/FilterPlugin.ini
